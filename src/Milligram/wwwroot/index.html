<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milligram</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='1' width='14' height='14' rx='3' fill='%237aa2ff'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='%230f1320' font-family='sans-serif' font-weight='bold'>mg</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="lib/elk.bundled.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <header id="bar">
      <button id="up" class="icon" title="Up a level (Esc)">←</button>
      <nav id="crumbs"></nav>
      <div id="banner" hidden>PROPOSAL — not instantiated in code</div>
      <div id="status"></div>
    </header>

    <main id="stage">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg" tabindex="0">
        <defs id="defs"></defs>
        <g id="viewport"></g>
      </svg>
      <div id="empty" hidden></div>
    </main>

    <aside id="inspector">
      <section class="head">
        <h1 id="title">Milligram</h1>
        <div id="subtitle" class="muted"></div>
        <div id="policy-error" class="error" hidden></div>
      </section>

      <section>
        <h2>Diagrams</h2>
        <ul id="contexts" class="list"></ul>
        <button id="new-proposal" class="wide">+ New proposal</button>
      </section>

      <section>
        <h2>View</h2>
        <div class="row"><span class="label">Arrows</span>
          <div class="seg" id="arrows">
            <button data-v="detailed" title="One arrow per box pair, down to nested boxes">Detailed</button>
            <button data-v="bundled" title="One arrow per component pair">Bundled</button>
            <button data-v="hidden" title="No lines: triangles show incoming (top) and outgoing (bottom)">Hidden</button>
          </div>
        </div>
        <div class="row"><span class="label">Boxes</span>
          <div class="seg" id="detail">
            <button data-v="members" title="Show public members on types">Members</button>
            <button data-v="names" title="Names only">Names</button>
            <button data-v="boxes" title="Hide what is inside components">Closed</button>
          </div>
        </div>
        <div class="row muted small">Zoom <span id="zoom-level">100%</span> · F fits · Ctrl+wheel zooms · drag pans</div>
      </section>

      <section>
        <h2>Selection</h2>
        <div id="selection" class="muted">Click a box. Double-click to open it.</div>
      </section>

      <section>
        <h2>Agent</h2>
        <div id="agent"></div>
        <textarea id="ask" rows="3" placeholder="Tell the agent what you want (Ctrl+Enter sends)…"></textarea>
        <button id="send" class="wide">Send to agent</button>
      </section>

      <section>
        <h2>Metrics</h2>
        <div id="metrics" class="small"></div>
        <div class="buttons">
          <button id="regen" title="Rescan the source">Regen</button>
          <button id="run-crap" title="Run tests with coverage and rescore CRAP">CRAP</button>
          <button id="run-mutate" title="Mutation-test members changed since their last run">Mutate changed</button>
        </div>
      </section>

      <section id="job-section" hidden>
        <h2>Job</h2>
        <div id="job" class="small"></div>
        <pre id="job-log"></pre>
      </section>

      <section>
        <h2>Legend</h2>
        <svg id="legend" width="260" height="150"></svg>
      </section>
    </aside>
  </div>

  <div id="card" class="panel" hidden></div>
  <div id="source" class="panel" hidden></div>
  <div id="menu" hidden></div>
  <div id="tip" hidden></div>
  <div id="toasts"></div>
</body>
</html>
