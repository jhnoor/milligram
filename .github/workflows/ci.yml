name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build, test, format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Milligram.slnx

      - name: Build (warnings are errors)
        run: dotnet build Milligram.slnx --no-restore -c Release -warnaserror

      - name: Test (includes the architecture tests)
        run: dotnet test Milligram.slnx --no-build -c Release

      - name: Format
        run: dotnet format Milligram.slnx --verify-no-changes --no-restore
