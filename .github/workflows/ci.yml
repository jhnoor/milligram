name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Milligram.slnx

      - name: Build (warnings are errors)
        run: dotnet build Milligram.slnx --no-restore -c Release -warnaserror

      - name: Test (includes the architecture tests)
        run: dotnet test Milligram.slnx --no-build -c Release

      - name: Pack and smoke test the installed tool and dnx
        shell: pwsh
        run: |
          $version = "0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}"
          dotnet pack src/Milligram -c Release -warnaserror -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./.github/scripts/smoke-package.ps1 -PackageDirectory ./artifacts -Version $version
          $package = "Milligram.$version.nupkg"
          $hash = (Get-FileHash (Join-Path ./artifacts $package) -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path ./artifacts 'VERSION.txt'), "$version`n")
          [IO.File]::WriteAllText((Join-Path ./artifacts 'SHA256SUMS'), "$hash  $package`n")
          $source = "Commit: $env:GITHUB_SHA`nRun: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n"
          [IO.File]::WriteAllText((Join-Path ./artifacts 'SOURCE.txt'), $source)

      - name: Retain the tested preview package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: milligram-preview
          path: |
            artifacts/Milligram.0.0.0-ci.*.nupkg
            artifacts/VERSION.txt
            artifacts/SHA256SUMS
            artifacts/SOURCE.txt
          if-no-files-found: error
          retention-days: 30

  # Formatting doesn't depend on the platform, so it is checked once.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Milligram.slnx

      - name: Format
        run: dotnet format Milligram.slnx --verify-no-changes --no-restore
