name: PTY spike (not for merge)

on:
  push:
    branches: [codex/pty-spike]
    paths: ['spikes/PtyProbe/**', '.github/workflows/pty-spike.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pty-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  probe:
    name: PTY (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
          - { os: windows-2025, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore pinned dependencies
        run: dotnet restore spikes/PtyProbe --locked-mode
      - name: Build the pinned probe
        run: dotnet build spikes/PtyProbe -c Release -warnaserror --no-restore
      - name: Verify formatting
        run: dotnet format spikes/PtyProbe/PtyProbe.csproj --verify-no-changes --no-restore
      - name: Pack and exercise the installed tool and dnx
        shell: pwsh
        run: |
          $version = '0.0.0-spike.${{ github.run_id }}.${{ github.run_attempt }}'
          dotnet pack spikes/PtyProbe -c Release --no-restore -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./spikes/PtyProbe/smoke.ps1 -Version $version -ExpectedRuntime '${{ matrix.rid }}'
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pty-${{ matrix.os }}
          path: artifacts/pty-results/*.md
          if-no-files-found: warn

  long-path:
    name: Long path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Compare native loading from a long global install
        shell: pwsh
        run: |
          $version = '0.0.0-long.${{ github.run_id }}.${{ github.run_attempt }}'
          dotnet restore spikes/PtyProbe --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet pack spikes/PtyProbe -c Release --no-restore -p:Version=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($layout in @('boundary', 'long')) {
            ./spikes/PtyProbe/long-path.ps1 -Version $version -ExpectedRuntime '${{ matrix.rid }}' -Layout $layout
          }
      - name: Upload both sides of the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pty-long-${{ matrix.os }}
          path: artifacts/pty-long-results/**/*.md
          if-no-files-found: warn
