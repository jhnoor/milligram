name: Browser viewer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  browser:
    name: Agent panel (${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            browser: chromium
            install: chromium
          - os: ubuntu-24.04
            browser: firefox
            install: firefox
          - os: macos-15
            browser: webkit
            install: webkit
          - os: windows-2025
            browser: chrome
            install: chrome
          - os: windows-2025
            browser: msedge
            install: msedge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Check browser fixture formatting
        if: matrix.browser == 'chromium'
        run: dotnet format tests/Milligram.Browser.Integration/Milligram.Browser.Integration.csproj --verify-no-changes
      - name: Build the viewer and fixture
        run: dotnet build tests/Milligram.Browser.Integration -c Release -warnaserror
      - name: Install the browser
        shell: pwsh
        run: tests/Milligram.Browser.Integration/bin/Release/net10.0/playwright.ps1 install --with-deps ${{ matrix.install }}
      - name: Exercise the viewer and agent panel
        run: dotnet run --project tests/Milligram.Browser.Integration -c Release --no-build -- ${{ matrix.browser }}
      - name: Exercise wide diagrams and asynchronous first fit
        run: dotnet run --project tests/Milligram.Browser.Integration -c Release --no-build -- ${{ matrix.browser }} --diagram
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: artifacts/browser/
          if-no-files-found: ignore
