name: Native agent host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-host-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  native:
    name: Real terminal (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64
          - os: windows-2025
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install tmux for isolated session ownership checks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v tmux >/dev/null; then
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo apt-get update
              sudo apt-get install -y tmux
            else
              brew install tmux
            fi
          fi
      - name: Check integration fixture formatting
        if: matrix.rid == 'linux-x64'
        run: dotnet format tests/Milligram.AgentHost.Integration/Milligram.AgentHost.Integration.csproj --verify-no-changes
      - name: Build the production adapter and fixture
        run: dotnet build tests/Milligram.AgentHost.Integration -c Release -warnaserror
      - name: Exercise the real terminal and owned process tree
        run: dotnet run --project tests/Milligram.AgentHost.Integration -c Release --no-build -- --expected-rid ${{ matrix.rid }}
