name: Path containment

on:
  push:
    branches: [main]
    paths:
      - src/Milligram/Application/ProjectPaths.cs
      - tests/Milligram.Tests/Application/ProjectPathsTests.cs
      - tests/Milligram.Tests/Adapters/WebServerTests.cs
      - .github/workflows/containment.yml
  pull_request:
    paths:
      - src/Milligram/Application/ProjectPaths.cs
      - tests/Milligram.Tests/Application/ProjectPathsTests.cs
      - tests/Milligram.Tests/Adapters/WebServerTests.cs
      - .github/workflows/containment.yml

permissions:
  contents: read

concurrency:
  group: containment-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  mutation:
    name: Mutate the guard with real Unix links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Publish an isolated dogfood build
        run: dotnet publish src/Milligram -c Release -warnaserror -o .milligram/dogfood
      - name: Collect coverage with the symlink regressions
        run: dotnet .milligram/dogfood/Milligram.dll crap
      - name: Mutate the complete containment guard
        run: dotnet .milligram/dogfood/Milligram.dll mutate --all src/Milligram/Application/ProjectPaths.cs
      - name: Save the mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-mutation
          path: .milligram/run/stryker/**/reports/mutation-report.json
          include-hidden-files: true
          if-no-files-found: error
